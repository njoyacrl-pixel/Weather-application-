<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Responsive Weather Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #eef2f5;
      color: #333;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    *{
    margin: 0;
    padding: 0;
}

.nav-bar{
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 20px;
    background-color: #4066C4;
}

.logo-name{
    color: #E47310;
    list-style: none;
    display: flex;
    gap: 20px;
    margin: 0;
    padding: 0;
}

.nav-links{
    list-style: none;
    display: flex;
    gap: 20px;
    margin: 0;
    padding: 0;
}

.nav-links a {
    color:white;
    text-decoration: none;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    font-size: 18px;
}
.sign-in{
    color: white;
    border-color: white;
    padding: 6px;
    font-size:18px ;
    background-color: #4066C4;
}

.sign-in:hover{
    background-color: white;
    color: #4066C4;
    transform: translate(-2px);
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
}

.sign-in:active{
    transform: translateY(0);
    box-shadow:none;
}

.logo-name{
    margin-right: auto;
    text-decoration: none;
    font-weight: bold;
    color: #E47310;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    font-size: 22px;
}


    .dashboard-container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 24px;
      flex: 1;
    }

    .location-header {
      margin-bottom: 24px;
    }

    .location-title {
      font-size: 32px;
      font-weight: 700;
      color: #1a1a1a;
      line-height: 1.2;
    }

    .section-title {
      color: #f37d36;
      font-size: 24px;
      font-weight: 700;
      margin-top: 24px;
      margin-bottom: 4px;
    }

    .sub-title {
      font-size: 14px;
      color: #666;
      margin-bottom: 20px;
      text-transform: capitalize;
    }

    .weather-card {
      background: #ffffff;
      border: 1px solid #dcdcdc;
      border-radius: 8px;
      padding: 28px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
    }

    /* Hourly Forecast Layout */
    .timeline-container {
      position: relative;
      margin-bottom: 36px;
      padding: 10px 0;
    }

    .timeline-row {
      display: flex;
      justify-content: space-between;
      position: relative;
      width: 100%;
    }

    .timeline-row::after {
      content: '';
      position: absolute;
      bottom: 22px;
      left: 3%;
      width: 94%;
      height: 2px;
      background-color: #cbd5e1;
      z-index: 1;
    }

    .hourly-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 2;
      flex: 1;
    }

    .weather-info {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 8px;
    }

    .icon-svg {
      width: 32px;
      height: 32px;
      fill: #475569;
      flex-shrink: 0;
    }

    .temp-val {
      font-size: 15px;
      color: #2b70c9;
      font-weight: 700;
    }

    .tick {
      width: 2px;
      height: 10px;
      background-color: #64748b;
      margin-bottom: 6px;
      border-radius: 2px;
    }

    .time-label {
      font-size: 13px;
      font-weight: 600;
      color: #334155;
    }

    /* Highlight Current Hour */
    .current-hour .icon-svg {
      fill: #f37d36;
    }
    .current-hour .temp-val {
      color: #f37d36;
    }
    .current-hour .tick {
      background-color: #f37d36;
      width: 4px;
      height: 14px;
    }
    .current-hour .time-label {
      color: #f37d36;
      font-weight: 800;
    }

    /* Daily Forecast Grid */
    .daily-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      border: 2px solid #2b70c9;
      border-radius: 6px;
      overflow: hidden;
      background: #fff;
    }

    .daily-col {
      border-right: 1px solid #2b70c9;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 8px;
    }

    .daily-col:last-child {
      border-right: none;
    }

    .day-label {
      color: #2b70c9;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 10px;
      text-transform: capitalize;
    }

    .daily-col .icon-svg {
      width: 30px;
      height: 30px;
      margin-bottom: 10px;
      fill: #2b70c9;
    }

    .daily-temp {
      font-size: 14px;
      font-weight: 600;
      color: #444;
    }

    @media (max-width: 992px) {
      .dashboard-container { padding: 20px 16px; }
      .weather-card { padding: 20px; }
      .location-title { font-size: 26px; }
    }

    @media (max-width: 768px) {
      .timeline-container {
        overflow-x: auto;
        padding-bottom: 12px;
        -webkit-overflow-scrolling: touch;
      }
      .timeline-row { min-width: 640px; }
      .daily-grid {
        grid-template-columns: 1fr;
        border: 1px solid #2b70c9;
      }
      .daily-col {
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
        padding: 12px 20px;
        border-right: none;
        border-bottom: 1px solid #e2e8f0;
      }
      .daily-col:last-child { border-bottom: none; }
      .day-label, .daily-col .icon-svg, .daily-temp { margin-bottom: 0; }
      .day-label { font-size: 15px; width: 60px; text-align: left; }
      .daily-temp { font-size: 15px; }
    }
  </style>
</head>
<body>

  <nav class="nav-bar">
        <a href="#" class="logo-name">ForeCast</a>

        <ul class="nav-links">
            <li><a href="#home">Home</a></li>
            <li><a href="#about">Weather</a></li>
            <li><a href="#contact">Contact Us</a></li>
            <li><a href="#Sign In"><button class="sign-in">Sign In</button></a></li>
        </ul>
    </nav>


  <main class="dashboard-container">
    <div class="weather-card">
      
      <section class="location-header">
        <h1 class="location-title" id="location-title">Bamenda, North West, Cameroon</h1>
      </section>

      <section>
        <h2 class="section-title">Hourly Forecast</h2>
        <p class="sub-title">weather today &nbsp;<span id="current-date"></span></p>

        <div class="timeline-container">
          <div class="timeline-row" id="hourly-container">
            <p>Loading weather data...</p>
          </div>
        </div>
      </section>

      <section>
        <h2 class="section-title">Daily Forecast</h2>
        <div class="daily-grid" id="daily-container"></div>
      </section>

    </div>
  </main>

  <script>
    // 1. Icon Generator Mapping WMO codes to SVGs
    function getWeatherIcon(code) {
      // Sun (Clear)
      if (code === 0 || code === 1) {
        return `<svg class="icon-svg" viewBox="0 0 24 24"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/></svg>`;
      } 
      // Rain/Drizzle
      else if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82)) {
        return `<svg class="icon-svg" viewBox="0 0 24 24"><path d="M14 20.75c0 .69-.56 1.25-1.25 1.25s-1.25-.56-1.25-1.25.56-1.25 1.25-1.25 1.25.56 1.25 1.25zm4 0c0 .69-.56 1.25-1.25 1.25s-1.25-.56-1.25-1.25.56-1.25 1.25-1.25 1.25.56 1.25 1.25zm-8 0c0 .69-.56 1.25-1.25 1.25S7.5 21.44 7.5 20.75 8.06 19.5 8.75 19.5s1.25.56 1.25 1.25zM19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/></svg>`;
      } 
      // Snow
      else if ((code >= 71 && code <= 77) || code === 85 || code === 86) {
        return `<svg class="icon-svg" viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM11 20.5l-1.5-1.5 1.5-1.5 1.5 1.5-1.5 1.5zm4 0l-1.5-1.5 1.5-1.5 1.5 1.5-1.5 1.5zm-8 0l-1.5-1.5 1.5-1.5 1.5 1.5-1.5 1.5z"/></svg>`;
      } 
      // Thunderstorm
      else if (code >= 95) {
        return `<svg class="icon-svg" viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM11 22l1-5H9l4-7v4h3l-5 8z"/></svg>`;
      } 
      // Default / Cloud
      else {
        return `<svg class="icon-svg" viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/></svg>`;
      }
    }

    // 2. Fetch and populate UI logic
    async function fetchWeather(lat, lon) {
      try {
        // Request 8 days of data to guarantee a full "Tue to Tue" length cycle
        const apiUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=temperature_2m,weathercode&daily=weathercode,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=8`;
        const res = await fetch(apiUrl);
        const data = await res.json();
        
        // --- Populate Hourly ---
        const nowTime = new Date().getTime();
        let closestIdx = 0;
        let minDiff = Infinity;
        
        // Find the index in the hourly array that perfectly matches the user's current hour
        data.hourly.time.forEach((t, i) => {
          const tTime = new Date(t).getTime();
          const diff = Math.abs(tTime - nowTime);
          if (diff < minDiff) {
            minDiff = diff;
            closestIdx = i;
          }
        });

        const hourlyContainer = document.getElementById('hourly-container');
        hourlyContainer.innerHTML = '';
        
        // Slices out 8 hours starting right now
        for (let i = closestIdx; i < closestIdx + 8; i++) {
          const timeStr = data.hourly.time[i];
          const temp = Math.round(data.hourly.temperature_2m[i]);
          const code = data.hourly.weathercode[i];
          
          const dateObj = new Date(timeStr);
          let hourFormat = dateObj.toLocaleTimeString('en-US', { hour: 'numeric', hour12: true });
          
          // Current hour styling
          const isCurrent = (i === closestIdx);
          const highlightClass = isCurrent ? 'current-hour' : '';
          const displayTime = isCurrent ? 'Now' : hourFormat.replace(' ', ''); // Converts "3 AM" to "3AM"

          hourlyContainer.innerHTML += `
            <div class="hourly-item ${highlightClass}">
              <div class="weather-info">
                ${getWeatherIcon(code)}
                <span class="temp-val">${temp}°</span>
              </div>
              <div class="tick"></div>
              <div class="time-label">${displayTime}</div>
            </div>
          `;
        }

        // --- Populate Daily ---
        const dailyContainer = document.getElementById('daily-container');
        dailyContainer.innerHTML = '';
        
        for (let i = 0; i < 8; i++) {
          const dateStr = data.daily.time[i];
          const code = data.daily.weathercode[i];
          const maxT = data.daily.temperature_2m_max[i];
          const minT = data.daily.temperature_2m_min[i];
          
          // Calculate Accurate Daily Average
          const avgT = Math.round((maxT + minT) / 2); 
          
          const dateObj = new Date(dateStr);
          const dayName = dateObj.toLocaleDateString('en-US', { weekday: 'short' });
          const displayDay = (i === 0) ? 'Today' : dayName;
          
          dailyContainer.innerHTML += `
            <div class="daily-col">
              <div class="day-label">${displayDay}</div>
              ${getWeatherIcon(code)}
              <div class="daily-temp">${avgT}°</div>
            </div>
          `;
        }
      } catch (error) {
        console.error("Failed to fetch weather data:", error);
      }
    }

    // 3. Initialize Location and Dates
    function init() {
      // Set localized current date
      const now = new Date();
      document.getElementById('current-date').textContent = now.toLocaleDateString('en-US', { month: 'long', day: 'numeric' });

      // Default Coordinates (Bamenda, Cameroon)
      const defaultLat = 5.958;
      const defaultLon = 10.152;

      // Ask for browser geolocation to give precise local reporting
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          async (pos) => {
            const { latitude, longitude } = pos.coords;
            try {
              // Free reverse geocoding to write the actual city/region on screen
              const locRes = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${latitude}&longitude=${longitude}&localityLanguage=en`);
              const locData = await locRes.json();
              document.getElementById('location-title').innerHTML = `${locData.city || locData.locality}, ${locData.principalSubdivision},<br>${locData.countryName}`;
            } catch (e) {
              console.warn("Reverse geocoding failed, keeping default text.");
            }
            fetchWeather(latitude, longitude);
          },
          (err) => {
            // Geolocation blocked or failed: Reverts strictly to Bamenda
            fetchWeather(defaultLat, defaultLon);
          }
        );
      } else {
        fetchWeather(defaultLat, defaultLon);
      }
    }

    // Run when DOM loads
    init();
  </script>
</body>
</html>
